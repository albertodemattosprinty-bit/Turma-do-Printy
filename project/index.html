<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <style>
      :root {
        --project-blue-start: #0a7cff;
        --project-blue-end: #0557ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: linear-gradient(160deg, var(--project-blue-start) 0%, var(--project-blue-end) 100%);
      }
    </style>
  </head>
  <body>
    <script>
      (function bootstrapProject() {
        // Base global para integrar APIs e login sem alterar a UI azul.
        window.ProjectApp = {
          baseUrl: window.location.origin,
          endpoints: {
            session: "/auth/session",
            login: "/auth/login",
            logout: "/auth/logout"
          }
        };
      })();
    </script>
  </body>
</html>
